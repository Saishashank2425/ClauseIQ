services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clauseiq
      POSTGRES_USER: clauseiq
      POSTGRES_PASSWORD: clauseiq_local_only
    ports: ["5432:5432"]
    volumes: [clauseiq_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U clauseiq -d clauseiq"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://clauseiq:clauseiq_local_only@db:5432/clauseiq
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  clauseiq_pgdata:
